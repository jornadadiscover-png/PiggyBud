    <script>
      (function() {
        try {
          var BUILD_ID = '2026-04-20T02-30-00Z-002';
          var STORAGE_KEY = '__pb_build_id__';
          var RELOAD_GUARD = '__pb_build_reloaded__';
          var prev = null;
          try { prev = localStorage.getItem(STORAGE_KEY); } catch (e) {}

          // Always try to remove any legacy SW/cache.
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(rs) {
              rs.forEach(function(r) {
                try { r.update(); } catch (e) {}
                try { r.unregister(); } catch (e) {}
              });
            }).catch(function(){});
          }
          if ('caches' in window) {
            caches.keys().then(function(ks) {
              ks.forEach(function(k) { try { caches.delete(k); } catch(e){} });
            }).catch(function(){});
          }

          // Build handshake: if build changed, force exactly one hard reload.
          if (prev !== BUILD_ID) {
            try { localStorage.setItem(STORAGE_KEY, BUILD_ID); } catch (e) {}
            var alreadyReloaded = false;
            try { alreadyReloaded = sessionStorage.getItem(RELOAD_GUARD) === BUILD_ID; } catch (e) {}
            if (prev !== null && !alreadyReloaded) {
              try { sessionStorage.setItem(RELOAD_GUARD, BUILD_ID); } catch (e) {}
              try { console.info('[PiggyBud] New build detected:', prev, '->', BUILD_ID, '— forcing reload'); } catch(e){}
              // Bust any HTTP cache by appending a cache-buster.
              var url = new URL(window.location.href);
              url.searchParams.set('_v', BUILD_ID);
              window.location.replace(url.toString());
              return;
            }
          }
          try { console.info('[PiggyBud] build:', BUILD_ID); } catch(e){}
        } catch (e) {}
      })();
    </script>
